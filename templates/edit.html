<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Editar Usuario</title>
</head>
<body>
    <h1>Editar Usuario: {{ usuario.nombre }}</h1>
    
    <!-- La acción apunta a la ruta de edición de ESTE usuario específico -->
    <form action="/edit/{{ usuario.id }}" method="POST">
        <label>Nombre:</label><br>
        <input type="text" name="nombre" value="{{ usuario.nombre }}" required><br><br>
        
        <label>Apellidos:</label><br>
        <input type="text" name="apellidos" value="{{ usuario.apellidos }}" required><br><br>
        
        <button type="submit">💾 Guardar Cambios</button>
    </form>
    
    <br>
    <a href="/manage">⬅️ Cancelar y volver</a>
</body>
</html>
