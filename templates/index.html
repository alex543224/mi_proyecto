<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Hola Render Alex</title>
</head>
<body>
    <h1>Hola mundo desde Render Soy Alex</h1>

    <h2>Añadir Usuario</h2>
    <!-- Este formulario envía los datos al servidor por el método POST -->
    <form action="/" method="POST">
        <input type="text" name="nombre" placeholder="Nombre" required>
        <input type="text" name="apellidos" placeholder="Apellidos" required>
        <button type="submit">Guardar</button>
    </form>

    <h2>Lista de Usuarios</h2>
    <ul>
        <!-- Esto es Jinja2, permite a Python inyectar código en el HTML -->
        {% for usuario in usuarios %}
            <li>{{ usuario.nombre }} {{ usuario.apellidos }}</li>
        {% else %}
            <li>No hay usuarios todavía.</li>
        {% endfor %}
    </ul>
</body>
</html>
